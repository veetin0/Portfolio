<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon. A single glyph on purpose: browsers draw this at 16px on
       non-retina displays, and two letterforms in 16px is unreadable mush.
       The full "VN" monogram lives on the in-page mark and the apple-icon,
       both of which are rendered large enough to carry it. -->
  <rect width="64" height="64" rx="14" fill="#0E1011" />
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#1E2224" />
  <path d="M15 15 L32 49 L49 15" fill="none" stroke="#C6F24E" stroke-width="9"
        stroke-linecap="square" stroke-linejoin="miter" />
</svg>
